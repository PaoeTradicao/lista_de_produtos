<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classificação de Produtos — Pão &amp; Tradição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#13215E;
    --azul-2:#1c2f7a;
    --dourado:#EFAD4C;
    --dourado-2:#f7c374;
    --creme:#F5F0DC;
    --verde:#3E7A52;
    --verde-2:#4f9366;
    --texto:#20262f;
    --muted:#6b7280;
    --linha:#e7e2d0;
    --branco:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--creme);
    color:var(--texto);
    min-height:100vh;
  }
  header{
    background:var(--azul);
    color:var(--branco);
    padding:22px 24px 20px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(19,33,94,.25);
  }
  .header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    max-width:1200px;
    margin:0 auto;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand h1{
    margin:0;
    font-size:19px;
    font-weight:800;
    letter-spacing:.2px;
  }
  .brand span{
    font-size:12.5px;
    color:var(--dourado-2);
    font-weight:600;
    letter-spacing:.3px;
  }
  .status{
    font-size:12px;
    color:#cdd3ee;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .status .dot{
    width:8px;height:8px;border-radius:50%;
    background:#8a93c9;
  }
  .status.ok .dot{background:#7fe3a3;}
  .status.err .dot{background:#e37f7f;}

  .toolbar{
    max-width:1200px;
    margin:0 auto;
    padding:16px 24px 0;
  }
  .search-row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .search-row input[type="text"]{
    flex:1;
    min-width:220px;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--linha);
    background:var(--branco);
    font-size:14px;
    font-family:inherit;
    color:var(--texto);
  }
  .search-row input[type="text"]:focus{
    outline:2px solid var(--dourado);
    outline-offset:1px;
    border-color:var(--dourado);
  }
  .btn{
    padding:11px 16px;
    border-radius:10px;
    border:1px solid var(--azul);
    background:var(--azul);
    color:var(--branco);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{background:var(--azul-2);}
  .btn.secundario{
    background:var(--branco);
    color:var(--azul);
    border:1px solid var(--linha);
  }
  .btn.secundario:hover{border-color:var(--azul);}
  .btn.dourado{
    background:var(--dourado);
    border-color:var(--dourado);
    color:var(--azul);
  }
  .btn.dourado:hover{background:var(--dourado-2);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .filtros{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .chip{
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--linha);
    background:var(--branco);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--texto);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip .n{
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .chip.active{
    background:var(--azul);
    border-color:var(--azul);
    color:var(--branco);
  }
  .chip.active.fab{background:var(--azul);border-color:var(--azul);}
  .chip.active.rev{background:var(--dourado);border-color:var(--dourado);color:var(--azul);}
  .chip.active.lan{background:var(--verde);border-color:var(--verde);color:var(--branco);}

  .legenda{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .legenda span{display:flex;align-items:center;gap:5px;}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .sw.fab{background:var(--azul);}
  .sw.rev{background:var(--dourado);}
  .sw.lan{background:var(--verde);}

  .export-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding:12px 0 14px;
    margin-top:4px;
    border-top:1px solid var(--linha);
  }
  .export-label{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    margin-right:2px;
  }
  .btn.pequeno{
    padding:8px 13px;
    font-size:12.5px;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:6px 24px 60px;
  }

  .lista-head{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:12px;
    padding:8px 14px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    font-weight:700;
  }
  .lista{
    background:var(--branco);
    border-radius:12px;
    border:1px solid var(--linha);
    overflow:hidden;
  }
  .linha{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:12px;
    align-items:center;
    padding:11px 14px;
    border-bottom:1px solid var(--linha);
  }
  .linha:last-child{border-bottom:none;}
  .linha:hover{background:#fbf9f1;}
  .linha.hidden{display:none;}
  .nome{
    font-size:13.5px;
    font-weight:500;
    line-height:1.3;
    color:var(--texto);
  }
  .cats{
    display:flex;
    gap:16px;
    justify-content:flex-start;
  }
  .cat-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    user-select:none;
  }
  .cat-toggle input{
    width:16px;height:16px;
    accent-color:var(--azul);
    cursor:pointer;
  }
  .cat-toggle.rev input{accent-color:var(--dourado);}
  .cat-toggle.lan input{accent-color:var(--verde);}
  .cat-toggle.checked{color:var(--texto);}

  .empty{
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  .rodape-info{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--azul);
    color:var(--branco);
    padding:11px 20px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-width:640px){
    .lista-head{display:none;}
    .linha{grid-template-columns:1fr;gap:8px;}
    .cats{gap:14px;flex-wrap:wrap;}
    .search-row{flex-direction:column;}
    .search-row .btn{width:100%;}
    .export-row .btn{width:auto;}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <h1>Classificação de Produtos</h1>
      <span>PÃO &amp; TRADIÇÃO</span>
    </div>
    <div class="status" id="statusFirebase"><span class="dot"></span><span id="statusTexto">Conectando ao banco de dados...</span></div>
  </div>
</header>

<div class="toolbar">
  <div class="search-row">
    <input type="text" id="busca" placeholder="Buscar produto por nome..." autocomplete="off">
    <button class="btn secundario" id="btnLimparBusca">Limpar busca</button>
  </div>

  <div class="filtros" id="filtros">
    <button class="chip active" data-filtro="todos">Todos <span class="n" id="cntTodos">0</span></button>
    <button class="chip fab" data-filtro="fabricacao">Fabricação <span class="n" id="cntFab">0</span></button>
    <button class="chip rev" data-filtro="revenda">Revenda <span class="n" id="cntRev">0</span></button>
    <button class="chip lan" data-filtro="lanchonete">Lanchonete <span class="n" id="cntLan">0</span></button>
    <button class="chip" data-filtro="sem">Sem classificação <span class="n" id="cntSem">0</span></button>
  </div>

  <div class="legenda">
    <span><i class="sw fab"></i> Fabricação</span>
    <span><i class="sw rev"></i> Revenda</span>
    <span><i class="sw lan"></i> Lanchonete</span>
  </div>

  <div class="export-row">
    <span class="export-label">Exportar PDF:</span>
    <button class="btn dourado pequeno" data-export="todos">Todos classificados</button>
    <button class="btn secundario pequeno" data-export="fabricacao">Só Fabricação</button>
    <button class="btn secundario pequeno" data-export="revenda">Só Revenda</button>
    <button class="btn secundario pequeno" data-export="lanchonete">Só Lanchonete</button>
  </div>
</div>

<main>
  <div class="lista-head">
    <div>Produto</div>
    <div>Classificação</div>
  </div>
  <div class="lista" id="lista"></div>
  <div class="empty" id="vazio" style="display:none;">Nenhum produto encontrado.</div>

  <div class="rodape-info">
    <span id="contadorVisivel"></span>
    <span>PADARIA PAO E TRADICAO — dados importados do Datahex ERP</span>
  </div>
</main>

<div class="toast" id="toast"></div>

// estado local: id -> {fabricacao, revenda, lanchonete}
const estado = {};
PRODUTOS.forEach(p => { estado[p.id] = { fabricacao:false, revenda:false, lanchonete:false }; });

const statusEl = document.getElementById('statusFirebase');
const statusTexto = document.getElementById('statusTexto');
const listaEl = document.getElementById('lista');
const vazioEl = document.getElementById('vazio');
const buscaEl = document.getElementById('busca');
const toastEl = document.getElementById('toast');
const contadorVisivelEl = document.getElementById('contadorVisivel');

let filtroAtivo = 'todos';
let termoBusca = '';
let toastTimer = null;

function mostrarToast(msg, isErro){
  toastEl.textContent = msg;
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.style.background = isErro ? '#a33' : 'var(--azul)';
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2200);
}

function normalizar(txt){
  return (txt||'').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase();
}

// callback preenchido pela Parte 2 (Firebase) — chamado a cada alteração de checkbox
let aoAlterarClassificacao = function(){};

// --- monta a lista no DOM (uma vez) ---
const linhasPorId = {};
const fragLista = document.createDocumentFragment();

PRODUTOS.forEach(p => {
  const linha = document.createElement('div');
  linha.className = 'linha';
  linha.dataset.id = p.id;
  linha.dataset.nome = normalizar(p.nome);

  const nomeDiv = document.createElement('div');
  nomeDiv.className = 'nome';
  nomeDiv.textContent = p.nome;

  const catsDiv = document.createElement('div');
  catsDiv.className = 'cats';

  function criarToggle(chave, rotulo, classe){
    const label = document.createElement('label');
    label.className = 'cat-toggle ' + classe;
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.dataset.chave = chave;
    input.addEventListener('change', () => onToggle(p.id, chave, input.checked, label));
    const span = document.createElement('span');
    span.textContent = rotulo;
    label.appendChild(input);
    label.appendChild(span);
    return label;
  }

  catsDiv.appendChild(criarToggle('fabricacao','Fabricação','fab'));
  catsDiv.appendChild(criarToggle('revenda','Revenda','rev'));
  catsDiv.appendChild(criarToggle('lanchonete','Lanchonete','lan'));

  linha.appendChild(nomeDiv);
  linha.appendChild(catsDiv);
  fragLista.appendChild(linha);

  linhasPorId[p.id] = linha;
});

listaEl.appendChild(fragLista);

function onToggle(id, chave, valor, labelEl){
  estado[id][chave] = valor;
  labelEl.classList.toggle('checked', valor);
  aoAlterarClassificacao(id);
  atualizarContadores();
  aplicarFiltro();
}

function aplicarEstadoNoDOM(){
  PRODUTOS.forEach(p => {
    const linha = linhasPorId[p.id];
    const ev = estado[p.id];
    linha.querySelectorAll('input[type="checkbox"]').forEach(input => {
      const chave = input.dataset.chave;
      input.checked = !!ev[chave];
      input.closest('.cat-toggle').classList.toggle('checked', !!ev[chave]);
    });
  });
}

function atualizarContadores(){
  let fab=0, rev=0, lan=0, sem=0;
  PRODUTOS.forEach(p=>{
    const e = estado[p.id];
    if(e.fabricacao) fab++;
    if(e.revenda) rev++;
    if(e.lanchonete) lan++;
    if(!e.fabricacao && !e.revenda && !e.lanchonete) sem++;
  });
  document.getElementById('cntTodos').textContent = PRODUTOS.length;
  document.getElementById('cntFab').textContent = fab;
  document.getElementById('cntRev').textContent = rev;
  document.getElementById('cntLan').textContent = lan;
  document.getElementById('cntSem').textContent = sem;
}

function passaFiltro(p){
  const e = estado[p.id];
  if(filtroAtivo === 'fabricacao') return !!e.fabricacao;
  if(filtroAtivo === 'revenda') return !!e.revenda;
  if(filtroAtivo === 'lanchonete') return !!e.lanchonete;
  if(filtroAtivo === 'sem') return !e.fabricacao && !e.revenda && !e.lanchonete;
  return true;
}

let aplicarFiltroTimer = null;
function aplicarFiltro(){
  clearTimeout(aplicarFiltroTimer);
  aplicarFiltroTimer = setTimeout(_aplicarFiltro, 60);
}

function _aplicarFiltro(){
  const termo = normalizar(termoBusca);
  let visiveis = 0;
  PRODUTOS.forEach(p=>{
    const linha = linhasPorId[p.id];
    const bateBusca = !termo || linha.dataset.nome.includes(termo);
    const bateFiltro = passaFiltro(p);
    const mostra = bateBusca && bateFiltro;
    linha.classList.toggle('hidden', !mostra);
    if(mostra) visiveis++;
  });
  vazioEl.style.display = visiveis === 0 ? 'block' : 'none';
  contadorVisivelEl.textContent = visiveis + ' produto(s) exibido(s) de ' + PRODUTOS.length;
}

buscaEl.addEventListener('input', (e)=>{
  termoBusca = e.target.value;
  aplicarFiltro();
});

document.getElementById('btnLimparBusca').addEventListener('click', ()=>{
  buscaEl.value = '';
  termoBusca = '';
  aplicarFiltro();
});

document.getElementById('filtros').addEventListener('click', (e)=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  filtroAtivo = btn.dataset.filtro;
  aplicarFiltro();
});


window.__estado = estado;
window.__PRODUTOS = PRODUTOS;
window.__mostrarToast = mostrarToast;
window.__aplicarEstadoNoDOM = aplicarEstadoNoDOM;
window.__atualizarContadores = atualizarContadores;
window.__aplicarFiltro = aplicarFiltro;
window.__statusEl = statusEl;
window.__statusTexto = statusTexto;
aoAlterarClassificacao = function(id){ if(window.__aoAlterarClassificacao) window.__aoAlterarClassificacao(id); };

atualizarContadores();
aplicarFiltro();

// --- exportação em PDF (não depende do Firebase) ---
document.querySelectorAll('[data-export]').forEach(btn=>{
  btn.addEventListener('click', ()=> exportarPDF(btn.dataset.export));
});

const CATEGORIAS_META = {
  fabricacao: { label:'Fabricação', cor:[19,33,94],    texto:[255,255,255] },
  revenda:    { label:'Revenda',    cor:[239,173,76],  texto:[19,33,94]    },
  lanchonete: { label:'Lanchonete', cor:[62,122,82],   texto:[255,255,255] }
};

async function exportarPDF(categoriaFiltro){
  const { jsPDF } = window.jspdf;
  const comBadges = categoriaFiltro === 'todos';

  const classificados = PRODUTOS.filter(p=>{
    const e = estado[p.id];
    if(categoriaFiltro === 'todos') return e.fabricacao || e.revenda || e.lanchonete;
    return !!e[categoriaFiltro];
  }).sort((a,b)=> a.nome.localeCompare(b.nome, 'pt-BR'));

  if(classificados.length === 0){
    mostrarToast('Nenhum produto nessa categoria ainda', true);
    return;
  }

  const docPdf = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = docPdf.internal.pageSize.getWidth();
  const pageH = docPdf.internal.pageSize.getHeight();
  const margin = 36;
  const topContentY = 78;
  const bottomLimit = pageH - 34;
  const colGap = 20;
  const numCols = 2;
  const colW = (pageW - margin*2 - colGap*(numCols-1)) / numCols;

  const COR_TEXTO = [32,38,47];
  const COR_MUTED = [110,116,128];
  const COR_LINHA = [225,220,202];

  const tituloTexto = comBadges
    ? 'Classificação de Produtos — Pão & Tradição'
    : 'Produtos — ' + CATEGORIAS_META[categoriaFiltro].label + ' — Pão & Tradição';

  function cabecalho(){
    docPdf.setFillColor(19,33,94);
    docPdf.rect(0, 0, pageW, 58, 'F');
    docPdf.setTextColor(255,255,255);
    docPdf.setFont('helvetica','bold');
    docPdf.setFontSize(13.5);
    docPdf.text(tituloTexto, margin, 27);
    docPdf.setFont('helvetica','normal');
    docPdf.setFontSize(8.5);
    docPdf.setTextColor(205,211,238);
    const dataGeracao = new Date().toLocaleString('pt-BR');
    docPdf.text('Gerado em ' + dataGeracao + '  -  ' + classificados.length + ' produto(s)  -  ordem alfabetica', margin, 41);
  }

  function roundedRect(x, yy, w, h, r){
    docPdf.roundedRect(x, yy, w, h, r, r, 'F');
  }

  function badge(x, yy, label, cor, corTexto){
    docPdf.setFont('helvetica','bold');
    docPdf.setFontSize(6.8);
    const w = docPdf.getTextWidth(label) + 9;
    docPdf.setFillColor(...cor);
    roundedRect(x, yy, w, 11.5, 5.75);
    docPdf.setTextColor(...corTexto);
    docPdf.text(label, x + 4.5, yy + 8.2);
    return w;
  }

  // posição de escrita: coluna atual (0 ou 1) e y de cada coluna
  let col = 0;
  let y = topContentY;

  function novaPagina(){
    docPdf.addPage();
    cabecalho();
    col = 0;
    y = topContentY;
  }

  function proximaPosicao(altura){
    if(y + altura > bottomLimit){
      if(col === 0){
        col = 1;
        y = topContentY;
      } else {
        novaPagina();
      }
    }
  }

  cabecalho();

  docPdf.setFont('helvetica','normal');

  classificados.forEach((p)=>{
    const e = estado[p.id];
    const x = margin + col * (colW + colGap);

    docPdf.setFont('helvetica','normal');
    docPdf.setFontSize(8.3);

    let badgesLargura = 0;
    const badgesAtivos = [];
    if(comBadges){
      ['fabricacao','revenda','lanchonete'].forEach(chave=>{
        if(e[chave]){
          const meta = CATEGORIAS_META[chave];
          docPdf.setFont('helvetica','bold');
          docPdf.setFontSize(6.8);
          const w = docPdf.getTextWidth(meta.label) + 9;
          badgesAtivos.push({ ...meta, w });
          badgesLargura += w + 3;
        }
      });
    }

    docPdf.setFont('helvetica','normal');
    docPdf.setFontSize(8.3);
    const larguraTexto = colW - badgesLargura - (badgesLargura > 0 ? 4 : 0);
    const nomeLinhas = docPdf.splitTextToSize(p.nome, larguraTexto);
    const lineHeight = 9.6;
    const alturaTexto = nomeLinhas.length * lineHeight;
    const alturaBadge = comBadges ? 11.5 : 0;
    const alturaLinha = Math.max(alturaTexto, alturaBadge) + 8;

    proximaPosicao(alturaLinha);
    const linhaX = margin + col * (colW + colGap);
    const linhaY = y;

    let textX = linhaX;
    if(badgesAtivos.length){
      let bx = linhaX;
      const by = linhaY + (alturaTexto > alturaBadge ? 0 : (alturaTexto - alturaBadge) / 2);
      badgesAtivos.forEach(b=>{
        bx += badge(bx, by, b.label, b.cor, b.texto) + 3;
      });
      textX = bx + 1;
    }

    docPdf.setTextColor(...COR_TEXTO);
    docPdf.setFont('helvetica','normal');
    docPdf.setFontSize(8.3);
    docPdf.text(nomeLinhas, textX, linhaY + 7.2, { lineHeightFactor: 1.15 });

    y = linhaY + alturaLinha;

    docPdf.setDrawColor(...COR_LINHA);
    docPdf.setLineWidth(0.4);
    docPdf.line(linhaX, y - 4, linhaX + colW, y - 4);
  });

  const totalPaginas = docPdf.internal.getNumberOfPages();
  for(let i=1;i<=totalPaginas;i++){
    docPdf.setPage(i);
    docPdf.setFont('helvetica','normal');
    docPdf.setFontSize(7.5);
    docPdf.setTextColor(...COR_MUTED);
    docPdf.text('Pagina ' + i + ' de ' + totalPaginas, pageW - margin, pageH - 16, { align:'right' });
  }

  const sufixo = comBadges ? 'todos' : categoriaFiltro;
  docPdf.save('classificacao-produtos-' + sufixo + '.pdf');
  mostrarToast('PDF exportado');
}
</script>

const COLECAO = "classificacao-produtos";

let filaSalvar = new Map();

function salvarProduto(id){
  filaSalvar.set(id, {...window.__estado[id]});

  salvarTimer = setTimeout(processarFila, 350);
}

async function processarFila(){
  const itens = Array.from(filaSalvar.entries());
  filaSalvar = new Map();
  for(const [id, valores] of itens){
    const algumaMarcada = valores.fabricacao || valores.revenda || valores.lanchonete;
    try{
      if(algumaMarcada){
        const produto = window.__PRODUTOS.find(p=>p.id===id);
        await setDoc(doc(db, COLECAO, id), {
          nome: produto ? produto.nome : '',
          fabricacao: !!valores.fabricacao,
          revenda: !!valores.revenda,
          lanchonete: !!valores.lanchonete,
          atualizadoEm: new Date().toISOString()
        });
      } else {
        await deleteDoc(doc(db, COLECAO, id));
      }
      window.__mostrarToast('Salvo');
    }catch(e){
      console.error(e);
      window.__mostrarToast('Erro ao salvar — verifique a conexão', true);
    }
  }
}

window.__aoAlterarClassificacao = salvarProduto;

async function carregarEstadoInicial(){
  try{
    const snap = await getDocs(collection(db, COLECAO));
    snap.forEach(d => {
      const data = d.data();
      if(window.__estado[d.id]){
        window.__estado[d.id] = {
          fabricacao: !!data.fabricacao,
          revenda: !!data.revenda,
          lanchonete: !!data.lanchonete
        };
      }
    });
    window.__aplicarEstadoNoDOM();
    window.__atualizarContadores();
    window.__aplicarFiltro();
    window.__statusEl.classList.add('ok');
    window.__statusTexto.textContent = 'Conectado — ' + snap.size + ' produtos já classificados';
  }catch(e){
    console.error(e);
    window.__statusEl.classList.add('err');
    window.__statusTexto.textContent = 'Não foi possível conectar ao banco de dados (o app funciona offline, mas nada será salvo)';
    window.__mostrarToast('Erro de conexão com o Firebase', true);
  }
}

carregarEstadoInicial();
</script>
